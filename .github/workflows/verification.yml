name: Verification

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KUJO_RUNTIME_REF: 2b3e07d398016e92008d8399e79c441e012dce38
      KENNEL_REF: 6df043c3ba0bde4445cc8f8f7d4c01c60c9c6d7e
      SHIPCHECK_REF: 2768e3040e766b0befd354db4427afc4c7a81899

    steps:
      - name: Checkout Redact
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Build released Kujo 1.0.0 runtime
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/kujo-runtime
          git -C /tmp/kujo-runtime remote add origin https://github.com/kujolang/kujo.git
          git -C /tmp/kujo-runtime fetch --depth 1 origin "$KUJO_RUNTIME_REF"
          git -C /tmp/kujo-runtime checkout --detach "$KUJO_RUNTIME_REF"
          test "$(git -C /tmp/kujo-runtime rev-parse HEAD)" = "$KUJO_RUNTIME_REF"
          cargo build --release --locked --manifest-path /tmp/kujo-runtime/Cargo.toml --bin kujo
          echo "KUJO_BIN=/tmp/kujo-runtime/target/release/kujo" >> "$GITHUB_ENV"

      - name: Fetch pinned release gate tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/kujolang/kennel.git /tmp/kennel
          git -C /tmp/kennel checkout --detach "$KENNEL_REF"
          git clone --filter=blob:none https://github.com/kujolang/shipcheck.git /tmp/shipcheck
          git -C /tmp/shipcheck checkout --detach "$SHIPCHECK_REF"
          echo "KENNEL_REPO=/tmp/kennel" >> "$GITHUB_ENV"
          echo "SHIPCHECK_REPO=/tmp/shipcheck" >> "$GITHUB_ENV"

      - name: Verify runtime and all Kujo sources
        shell: bash
        run: |
          set -euo pipefail
          "$KUJO_BIN" --version
          while IFS= read -r file; do "$KUJO_BIN" check "$file"; done < <(find . -type f -name '*.kujo' -not -path './.git/*' | sort)

      - name: Run deterministic, fixture, example, and adversarial tests
        run: bash tests/run.sh

      - name: Check version, formatting, lint, links, diff, and artifact hygiene
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-version-consistency.sh
          bash scripts/check-kujo-style.sh
          python3 scripts/check-markdown-links.py
          git diff --check
          bash scripts/check-generated-artifacts.sh

      - name: Validate Kennel manifest
        run: |
          "$KUJO_BIN" run "$KENNEL_REPO/kennel.kujo" --interpreter -- validate --project-dir "$GITHUB_WORKSPACE"

      - name: Run ShipCheck release gate
        run: |
          "$KUJO_BIN" run "$SHIPCHECK_REPO/shipcheck.kujo" gate --dir "$GITHUB_WORKSPACE" --format json
