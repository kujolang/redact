name: Verification

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KUJO_RUNTIME_REF: 266a8902068a14c3d17f803bef467dc28f1fe162
      KENNEL_REF: 6df043c3ba0bde4445cc8f8f7d4c01c60c9c6d7e
      SHIPCHECK_REF: 2768e3040e766b0befd354db4427afc4c7a81899

    steps:
      - name: Checkout Redact
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Build released Kujo 1.4.0 runtime
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/kujo-runtime
          git -C /tmp/kujo-runtime remote add origin https://github.com/kujolang/kujo.git
          git -C /tmp/kujo-runtime fetch --depth 1 origin "$KUJO_RUNTIME_REF"
          git -C /tmp/kujo-runtime checkout --detach "$KUJO_RUNTIME_REF"
          test "$(git -C /tmp/kujo-runtime rev-parse HEAD)" = "$KUJO_RUNTIME_REF"
          cargo build --release --locked --manifest-path /tmp/kujo-runtime/Cargo.toml --bin kujo
          echo "KUJO_BIN=/tmp/kujo-runtime/target/release/kujo" >> "$GITHUB_ENV"

      - name: Fetch pinned release gate tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/kujolang/kennel.git /tmp/kennel
          git -C /tmp/kennel checkout --detach "$KENNEL_REF"
          git clone --filter=blob:none https://github.com/kujolang/shipcheck.git /tmp/shipcheck
          git -C /tmp/shipcheck checkout --detach "$SHIPCHECK_REF"
          echo "KENNEL_REPO=/tmp/kennel" >> "$GITHUB_ENV"
          echo "SHIPCHECK_REPO=/tmp/shipcheck" >> "$GITHUB_ENV"

      - name: Verify runtime and all Kujo sources
        shell: bash
        run: |
          set -euo pipefail
          "$KUJO_BIN" --version
          while IFS= read -r file; do "$KUJO_BIN" check "$file"; done < <(find . -type f -name '*.kujo' -not -path './.git/*' | sort)

      - name: Run deterministic, fixture, example, and adversarial tests
        run: bash tests/run.sh

      - name: Check version, formatting, lint, links, diff, and artifact hygiene
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-version-consistency.sh
          bash scripts/check-kujo-style.sh
          python3 scripts/check-markdown-links.py
          git diff --check
          bash scripts/check-generated-artifacts.sh

      - name: Validate Kennel manifest
        run: |
          "$KUJO_BIN" run "$KENNEL_REPO/kennel.kujo" --interpreter -- validate --project-dir "$GITHUB_WORKSPACE"

      - name: Run ShipCheck release gate
        run: |
          "$KUJO_BIN" run "$SHIPCHECK_REPO/shipcheck.kujo" gate --dir "$GITHUB_WORKSPACE" --format json

  install-smoke:
    needs: release-gates
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout Redact
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify release archive and smoke clean source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/install-smoke.py --benchmarks

  workcell-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      WORKCELL_REF: 074d7262ef6c565e3dabd22ee046228c7329e5c1
      WORKCELL_KUJO_REF: 692512a9070fdba713f160d795bbddb8077db7b5
    steps:
      - name: Checkout exact Redact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Require Linux Docker seccomp and AppArmor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker info --format '{{json .SecurityOptions}}' |
            jq -e 'index("name=apparmor") != null and any(.[]; startswith("name=seccomp"))'

      - name: Build pinned Workcell runtime and source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/workcell-kujo"
          git -C "$RUNNER_TEMP/workcell-kujo" remote add origin https://github.com/kujolang/kujo.git
          git -C "$RUNNER_TEMP/workcell-kujo" fetch --depth 1 origin "$WORKCELL_KUJO_REF"
          git -C "$RUNNER_TEMP/workcell-kujo" checkout --detach "$WORKCELL_KUJO_REF"
          test "$(git -C "$RUNNER_TEMP/workcell-kujo" rev-parse HEAD)" = "$WORKCELL_KUJO_REF"
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/workcell-kujo/Cargo.toml" --bin kujo
          git init "$RUNNER_TEMP/workcell-src"
          git -C "$RUNNER_TEMP/workcell-src" remote add origin https://github.com/kujolang/workcell.git
          git -C "$RUNNER_TEMP/workcell-src" fetch --depth 1 origin "$WORKCELL_REF"
          git -C "$RUNNER_TEMP/workcell-src" checkout --detach "$WORKCELL_REF"
          test "$(git -C "$RUNNER_TEMP/workcell-src" rev-parse HEAD)" = "$WORKCELL_REF"
          test "$(cat "$RUNNER_TEMP/workcell-src/RUNTIME_VERSION")" = "$WORKCELL_KUJO_REF"
          echo "KUJO=$RUNNER_TEMP/workcell-kujo/target/release/kujo" >> "$GITHUB_ENV"
          docker build --tag kujolang/workcell-base:local "$RUNNER_TEMP/workcell-src/docker"

      - name: Prove and verify exact candidate
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/workcell-src/bin/workcell" doctor --backend docker --json |
            jq -e '.ok == true and .blocked == 0'
          "$RUNNER_TEMP/workcell-src/bin/workcell" run \
            --file "$GITHUB_WORKSPACE/docs/workcell-launch-gate.json" \
            --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/redact-workcell-runs" \
            --no-pull --summary > "$RUNNER_TEMP/redact-workcell-summary.json"
          jq -e '.schema_version == "workcell-run-summary/v1" and .ok == true' \
            "$RUNNER_TEMP/redact-workcell-summary.json"
          run_dir="$(jq -r '.output_dir' "$RUNNER_TEMP/redact-workcell-summary.json")"
          test -d "$run_dir"
          jq -e --arg sha "$GITHUB_SHA" '.source_commit == $sha and .network_mode == "none"' \
            "$run_dir/receipt.json"
          "$RUNNER_TEMP/workcell-src/bin/workcell" verify --run "$run_dir" --json |
            jq -e '.ok == true'

      - name: Retain proof outside Git
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: redact-workcell-proof-${{ github.sha }}
          path: ${{ runner.temp }}/redact-workcell-runs/
          retention-days: 7
          if-no-files-found: error
